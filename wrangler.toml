name = "password-share"
main = "worker.js"
compatibility_date = "2026-08-11"

# 静态资源：前端纯静态 HTML（public/ 目录），由本 Worker 托管
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# D1（Cloudflare 免费 SQLite）作为唯一存储，替代原 MySQL
# 第一次部署前请先执行：npx wrangler d1 create password-share
# 然后把输出的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "password-share"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"
