<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 私密分享站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="common.js"></script>
</head>
<body class="bg-neutral-950 text-white">
  <div id="app"></div>
  <script>
    const RESOURCE_NAMES = { "1": "边玩边赚公众号", "2": "得劲滋润爽的B站" };
    const app = document.getElementById("app");
    let adminCode = "";
    let resTab = "1", tab = "content", items = [], msg = "";
    let newTitle = "", newContent = "", submitting = false, visitorPwd = "", adminPwd = "", page = 1, pageSize = 10;

    function flash(t) {
      msg = t; render();
      setTimeout(() => { msg = ""; render(); }, 2500);
    }

    async function fetchItems(code, resId) {
      const res = await fetch("/api/content?resource=" + resId, { headers: { "X-Admin-Code": code } });
      if (res.ok) {
        const d = await res.json();
        items = d.items || [];
        page = 1;
        return true;
      }
      return false;
    }

    // 统一的后台请求封装：携带会话令牌，遇到「未授权」自动退回登录
    async function adminFetch(url, payload) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Code": adminCode },
        body: JSON.stringify(payload),
      });
      let d = {};
      try { d = await res.json(); } catch (_) {}
      if (res.status === 401 && (d.error === "未授权" || d.error === "管理密码错误")) {
        sessionStorage.removeItem("admin_code");
        location.href = "login.html";
        return null;
      }
      return { res, d };
    }

    async function handleAdd(e) {
      e.preventDefault();
      if (!newTitle.trim()) { flash("标题不能为空"); return; }
      submitting = true; render();
      const r = await adminFetch("/api/admin/content", { resource: resTab, type: "text", title: newTitle, content: newContent });
      submitting = false;
      if (!r) return;
      const { res, d } = r;
      if (res.ok) {
        newTitle = ""; newContent = "";
        await fetchItems(adminCode, resTab);
        flash("添加成功");
      } else {
        flash(d.error || "添加失败");
      }
      render();
    }

    async function handleDelete(id) {
      if (!confirm("确定删除这条内容吗？")) return;
      const r = await adminFetch("/api/admin/content/delete", { resource: resTab, id });
      if (!r) return;
      const { res, d } = r;
      if (res.ok) {
        items = items.filter((it) => it.id !== id);
        const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
        if (page > totalPages) page = totalPages;
        flash("已删除");
      } else {
        flash(d.error || "删除失败");
      }
    }

    async function handleChangePassword(which) {
      const value = which === "visitor" ? visitorPwd : adminPwd;
      if (!value.trim()) return;
      const body = which === "visitor"
        ? { resource: resTab, visitorPassword: value }
        : { adminPassword: value };
      const r = await adminFetch("/api/admin/password", body);
      if (!r) return;
      const { res, d } = r;
      if (res.ok) {
        // 改管理密码不改会话令牌：当前登录保持有效，发布/删除不会因改密码而失步
        visitorPwd = ""; adminPwd = "";
        flash(which === "visitor" ? "访问密码已更新" : "管理密码已更新（当前登录会话保持有效）");
      } else {
        flash(d.error || "修改失败");
      }
    }

    function changePage(delta) {
      const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
      page = Math.min(totalPages, Math.max(1, page + delta));
      render();
    }

    async function switchResource(id) {
      resTab = id; page = 1;
      await fetchItems(adminCode, resTab);
      render();
    }

    function handleLogout() {
      sessionStorage.removeItem("admin_code");
      location.href = "login.html";
    }

    async function handleExport() {
      try {
        const res = await fetch("/api/admin/export", { headers: { "X-Admin-Code": adminCode } });
        if (res.status === 401) {
          sessionStorage.removeItem("admin_code");
          location.href = "login.html";
          return;
        }
        if (!res.ok) { flash("导出失败"); return; }
        const data = await res.json();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        a.href = URL.createObjectURL(blob);
        a.download = "share-backup-" + ts + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        flash("已导出数据文件");
      } catch (e) {
        flash("导出失败：" + (e && e.message ? e.message : e));
      }
    }

    async function handleImportFile(e) {
      const input = e.target;
      const file = input.files && input.files[0];
      input.value = "";
      if (!file) return;
      if (!confirm("导入将覆盖当前的资源共享密码与内容，确定继续？")) return;
      try {
        const text = await file.text();
        const obj = JSON.parse(text);
        const r = await adminFetch("/api/admin/import", obj);
        if (!r) return;
        const { res, d } = r;
        if (res.ok) {
          await fetchItems(adminCode, resTab);
          flash("数据已导入");
        } else {
          flash(d.error || "导入失败");
        }
      } catch (err) {
        flash("导入失败：" + (err && err.message ? err.message : "文件格式错误"));
      }
    }

    function render() {
      const rn = RESOURCE_NAMES[resTab];
      const html = `<main class="min-h-screen bg-neutral-950 text-white">
        <header class="border-b border-neutral-800"><div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
          <div class="flex items-center gap-2"><i data-lucide="shield" class="w-5 h-5 text-amber-400"></i><h1 class="text-lg font-semibold">边玩边赚游戏分享站管理后台</h1></div>
          <button onclick="handleLogout()" class="flex items-center gap-1.5 text-sm text-neutral-400 hover:text-white transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i> 退出</button>
        </div></header>
        <div class="max-w-2xl mx-auto px-4 py-6">
          <div class="flex gap-2 mb-4">
            ${Object.entries(RESOURCE_NAMES).map(([id, name]) => `<button onclick="void switchResource('${id}')" class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${resTab === id ? "bg-white text-neutral-900" : "bg-neutral-900 text-neutral-400 hover:text-white"}"><i data-lucide="user" class="w-3.5 h-3.5"></i> ${esc(name)}</button>`).join("")}
          </div>
          <div class="flex gap-2 mb-6">
            <button onclick="tab='content';page=1;render();" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab === "content" ? "bg-white text-neutral-900" : "bg-neutral-900 text-neutral-400 hover:text-white"}">内容管理 · ${esc(rn)}</button>
            <button onclick="tab='password';render();" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab === "password" ? "bg-white text-neutral-900" : "bg-neutral-900 text-neutral-400 hover:text-white"}">密码设置</button>
            <button onclick="tab='backup';render();" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab === "backup" ? "bg-white text-neutral-900" : "bg-neutral-900 text-neutral-400 hover:text-white"}">数据备份</button>
          </div>
          ${msg ? `<div class="mb-4 px-4 py-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-sm text-emerald-400">${esc(msg)}</div>` : ""}
          ${tab === "content" ? `
            <div class="space-y-6">
              <form onsubmit="handleAdd(event)" class="rounded-2xl border border-neutral-800 bg-neutral-900 p-5 space-y-4">
                <h2 class="font-medium flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> 添加分享 · ${esc(rn)}</h2>
                <input value="${esc(newTitle)}" oninput="newTitle=this.value" placeholder="标题（必填）" required class="w-full px-4 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-400"/>
                <textarea oninput="newContent=this.value" placeholder="正文内容" rows="5" class="w-full px-4 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-400 resize-y">${esc(newContent)}</textarea>
                <button type="submit" ${submitting ? "disabled" : ""} class="w-full py-2.5 rounded-xl bg-white text-neutral-900 font-medium hover:bg-neutral-200 disabled:opacity-50 transition-colors">${submitting ? "提交中..." : "发布"}</button>
              </form>
              <div class="space-y-3">
                ${(() => {
                  const sorted = items.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                  const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
                  const pageItems = sorted.slice((page - 1) * pageSize, page * pageSize);
                  return `
                    <h2 class="text-sm text-neutral-400">已发布（${sorted.length}）</h2>
                    ${sorted.length === 0 ? '<p class="text-center text-neutral-600 py-8 text-sm">还没有内容，添加第一条吧</p>' : ""}
                    ${pageItems.map((item) => `<div class="rounded-xl border border-neutral-800 bg-neutral-900 p-4 flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="flex items-center gap-2"><i data-lucide="file-text" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i><span class="font-medium truncate">${esc(item.title)}</span></div>
                        ${item.url ? `<p class="text-xs text-neutral-500 mt-1 truncate">${esc(item.url)}</p>` : ""}
                        ${item.content ? `<p class="text-xs text-neutral-500 mt-1 line-clamp-2">${esc(item.content)}</p>` : ""}
                      </div>
                      <button onclick="handleDelete('${esc(item.id)}')" class="p-2 rounded-lg text-neutral-500 hover:text-red-400 hover:bg-red-500/10 transition-colors shrink-0" title="删除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`).join("")}
                    ${totalPages > 1 ? `<div class="flex items-center justify-center gap-3 pt-2">
                      <button onclick="changePage(-1)" ${page <= 1 ? "disabled" : ""} class="px-3 py-1.5 rounded-lg text-sm ${page <= 1 ? "text-neutral-700" : "text-neutral-300 hover:bg-neutral-800"} transition-colors">上一页</button>
                      <span class="text-xs text-neutral-500">第 ${page} / ${totalPages} 页 · 共 ${sorted.length} 条</span>
                      <button onclick="changePage(1)" ${page >= totalPages ? "disabled" : ""} class="px-3 py-1.5 rounded-lg text-sm ${page >= totalPages ? "text-neutral-700" : "text-neutral-300 hover:bg-neutral-800"} transition-colors">下一页</button>
                    </div>` : ""}
                  `;
                })()}
              </div>
            </div>` : tab === "password" ? `
            <div class="space-y-4">
              <div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-5 space-y-3">
                <h2 class="font-medium flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4 text-blue-400"></i> 访客访问密码 · ${esc(rn)}</h2>
                <p class="text-xs text-neutral-500">当前资源的访客访问密码，输入此密码即可查看该资源分享内容（至少 4 位）</p>
                <div class="flex gap-2">
                  <input value="${esc(visitorPwd)}" oninput="visitorPwd=this.value" placeholder="新访问密码" class="flex-1 px-4 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-400"/>
                  <button onclick="handleChangePassword('visitor')" class="px-4 py-2.5 rounded-xl bg-white text-neutral-900 text-sm font-medium hover:bg-neutral-200 transition-colors">更新</button>
                </div>
              </div>
              <div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-5 space-y-3">
                <h2 class="font-medium flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4 text-amber-400"></i> 管理密码（全局）</h2>
                <p class="text-xs text-neutral-500">登录本管理后台的密码（至少 6 位），修改后立即生效，对所有资源通用</p>
                <div class="flex gap-2">
                  <input value="${esc(adminPwd)}" oninput="adminPwd=this.value" placeholder="新管理密码" class="flex-1 px-4 py-2.5 rounded-xl bg-neutral-950 border border-neutral-700 text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-400"/>
                  <button onclick="handleChangePassword('admin')" class="px-4 py-2.5 rounded-xl bg-white text-neutral-900 text-sm font-medium hover:bg-neutral-200 transition-colors">更新</button>
                </div>
              </div>
            </div>` : `
            <div class="space-y-4">
              <div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-5 space-y-3">
                <h2 class="font-medium flex items-center gap-2"><i data-lucide="database" class="w-4 h-4 text-emerald-400"></i> 数据备份与还原</h2>
                <p class="text-xs text-neutral-500 leading-relaxed">导出会下载一个 JSON 文件，包含全部资源共享密码与内容；导入将用该文件覆盖当前数据（不会登出当前后台登录）。</p>
                <div class="flex gap-2 pt-1">
                  <button onclick="handleExport()" class="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-white text-neutral-900 text-sm font-medium hover:bg-neutral-200 transition-colors"><i data-lucide="download" class="w-4 h-4"></i> 一键导出</button>
                  <button onclick="document.getElementById('importFile').click()" class="flex-1 flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl border border-neutral-700 text-neutral-200 text-sm font-medium hover:bg-neutral-800 transition-colors"><i data-lucide="upload" class="w-4 h-4"></i> 一键导入</button>
                  <input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="handleImportFile(event)"/>
                </div>
              </div>
            </div>`}
        </div>
      </main>`;
      app.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    // 入口：无令牌直接跳登录页；有令牌则拉数据渲染仪表台
    const TOKEN = sessionStorage.getItem("admin_code");
    if (!TOKEN) {
      location.href = "login.html";
    } else {
      adminCode = TOKEN;
      fetchItems(adminCode, resTab).then((ok) => {
        if (ok) {
          render();
        } else {
          sessionStorage.removeItem("admin_code");
          location.href = "login.html";
        }
      });
    }
  </script>
</body>
</html>
