<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>访问验证 · 私密分享站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="common.js"></script>
  <style>
    :root { --accent: #6b7280; --accent-hover: #4b5563; }
    .accent-btn { background-color: var(--accent); }
    .accent-btn:hover { background-color: var(--accent-hover); }
    .accent-text { color: var(--accent); }
    .accent-text-hover:hover { color: var(--accent); }
  </style>
</head>
<body class="bg-neutral-950 text-white">
  <div id="app"></div>
  <script>
    const app = document.getElementById("app");
    const resource = (function () {
      const p = getQueryParam("resource");
      return RESOURCES[p] ? p : null;
    })();
    let password = "", error = "", loading = false;

    async function handleLogin(e) {
      e.preventDefault();
      if (!password.trim() || !resource) return;
      loading = true; error = ""; render();
      try {
        const res = await fetch("/api/auth/visitor", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ resource, password }),
        });
        if (res.ok) {
          sessionStorage.setItem("share_access", JSON.stringify({ resource, code: password }));
          location.href = "content.html?resource=" + resource;
          return;
        } else {
          const d = await res.json().catch(() => ({}));
          error = d.error || "密码错误，请重试";
        }
      } catch (_) {
        error = "网络错误，请稍后重试";
      }
      loading = false; render();
    }

    function back() {
      location.href = "index.html";
    }

    function render() {
      if (!resource) {
        app.innerHTML = `<main class="min-h-screen flex items-center justify-center bg-neutral-950 px-4"><div class="text-center"><p class="text-neutral-400">资源不存在</p><a href="index.html" class="mt-4 inline-block text-sm text-blue-400">返回首页</a></div></main>`;
        if (window.lucide) lucide.createIcons();
        return;
      }
      applyTheme(resource);
      const cfg = RESOURCES[resource];
      const html = `<main class="min-h-screen flex items-center justify-center bg-neutral-950 px-4"><div class="w-full max-w-sm">
        <div class="flex flex-col items-center mb-8">
          <div class="w-14 h-14 rounded-2xl bg-neutral-800 flex items-center justify-center mb-4"><i data-lucide="lock" class="w-6 h-6 accent-text"></i></div>
          <h1 class="text-xl font-semibold text-white text-center">${esc(cfg.title)}</h1>
          <p class="text-sm text-neutral-400 mt-2 text-center">${esc(cfg.prompt)}</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <input type="password" value="${esc(password)}" oninput="password=this.value" placeholder="访问密码" autofocus class="w-full px-4 py-3 rounded-xl bg-neutral-900 border border-neutral-700 text-white placeholder-neutral-500 focus:outline-none focus:border-neutral-400 transition-colors"/>
          ${error ? `<p class="text-sm text-red-400">${esc(error)}</p>` : ""}
          <button type="submit" ${loading ? "disabled" : ""} class="w-full py-3 rounded-xl accent-btn text-white font-medium disabled:opacity-50 transition-colors">${loading ? "验证中..." : "进入"}</button>
        </form>
        <div class="mt-6 w-full text-center space-y-3">
          <a href="${esc(cfg.link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-sm accent-text">${esc(cfg.linkText)} <i data-lucide="external-link" class="w-3.5 h-3.5"></i></a>
          <div class="flex justify-center"><img src="${esc(cfg.qr)}" alt="${esc(cfg.qrAlt)}" class="w-40 h-40 rounded-xl border border-neutral-800 bg-white p-1"/></div>
        </div>
        <button onclick="back()" class="mt-4 w-full text-center text-xs text-neutral-500 hover:text-neutral-300 transition-colors">返回，选择其他账号</button>
      </div></main>`;
      app.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    render();
  </script>
</body>
</html>
