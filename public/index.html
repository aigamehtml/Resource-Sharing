<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私密分享站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="common.js"></script>
</head>
<body class="bg-neutral-950 text-white">
  <div id="app"></div>
  <script>
    const app = document.getElementById("app");

    function goLogin(id) {
      location.href = "login.html?resource=" + id;
    }

    function render() {
      const html = `<main class="min-h-screen flex items-center justify-center bg-neutral-950 px-4"><div class="w-full max-w-md">
        <h1 class="text-xl font-semibold text-white text-center mb-2">请选择你要获取资源的账号</h1>
        <p class="text-sm text-neutral-400 text-center mb-8">选择后输入对应密码查看分享内容</p>
        <div class="space-y-4">
        ${Object.entries(RESOURCES).map(([id, r]) => `<button onclick="goLogin('${id}')" class="w-full flex items-center gap-4 px-5 py-5 rounded-2xl bg-neutral-900 border border-neutral-800 text-left hover:border-neutral-500 hover:bg-neutral-800 transition-colors">
          <div class="w-11 h-11 rounded-xl bg-neutral-800 flex items-center justify-center shrink-0"><i data-lucide="user" class="w-5 h-5 text-neutral-300"></i></div>
          <div class="min-w-0"><div class="font-medium text-white">${esc(r.name)}</div><div class="text-xs text-neutral-500 mt-0.5 truncate">${esc(r.title)}</div></div>
        </button>`).join("")}
        </div></div></main>`;
      app.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    render();
  </script>
</body>
</html>
